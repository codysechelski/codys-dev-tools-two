name: Build Desktop Apps

# Runs after the Release workflow finishes, builds the desktop app for each OS, and
# uploads the installers to the GitHub Release semantic-release just published.
#
# This can't just trigger on `push: tags`, because the tag is pushed by the Release
# workflow using the default GITHUB_TOKEN — and GitHub deliberately does not let a
# token-authenticated push from one workflow trigger another (it's an anti-loop
# safeguard). Chaining via workflow_run sidesteps that without needing a PAT.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 for Xcode 26's actool, which electron-builder needs to compile
          # build/AppIcon.icon (Icon Composer) into the app's Liquid Glass icon.
          - os: macos-26
            edition: consumer
            args: --mac --universal
          - os: windows-latest
            edition: consumer
            args: --win --x64
          - os: ubuntu-latest
            edition: consumer
            args: --linux --x64 --arm64
          # Enterprise edition (src/edition.ts): the managed-deployment .pkg/.dmg and .msi,
          # packaged with electron-builder.enterprise.cjs.
          - os: macos-26
            edition: enterprise
            args: --mac --universal
          - os: windows-latest
            edition: enterprise
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      # No explicit ref: this checks out main's current tip, which by now includes the
      # version-bump commit and tag the Release workflow just pushed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only build if the commit we just checked out is actually a tagged release —
      # the Release workflow "succeeding" doesn't mean it published anything (most
      # pushes to main don't warrant a release, e.g. docs/chore commits).
      - id: check_tag
        shell: bash
        run: |
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check_tag.outputs.should_build == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check_tag.outputs.should_build == 'true'

      # electron-builder's rpm and pacman targets shell out to rpmbuild and bsdtar, which
      # the Ubuntu runner doesn't ship with.
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
        if: steps.check_tag.outputs.should_build == 'true' && runner.os == 'Linux'

      # macOS code signing + notarization. electron-builder reads these env vars: CSC_LINK /
      # CSC_KEY_PASSWORD are the base64 "Developer ID Application" .p12 it signs the .app with,
      # CSC_INSTALLER_LINK / CSC_INSTALLER_KEY_PASSWORD the "Developer ID Installer" .p12 it signs
      # the enterprise .pkg with, and APPLE_API_KEY (a path to the App Store Connect .p8) +
      # APPLE_API_KEY_ID + APPLE_API_ISSUER let it notarize and staple the .app (and the .pkg).
      # Everything is exported only when the secrets exist, so forks and a repo without them
      # still produce (unsigned) builds instead of failing on empty values. Windows has no
      # certificate, so there (and on Linux) electron-builder is told not to go looking for one.
      # This goes through $GITHUB_ENV rather than step-level `env:`, which would override it.
      - name: Configure code signing
        if: steps.check_tag.outputs.should_build == 'true'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$RUNNER_OS" != "macOS" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$MAC_CERT_P12_BASE64" ]; then
            echo "::warning::MAC_CERT_P12_BASE64 isn't set; building an unsigned, un-notarized macOS app"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "CSC_LINK=$MAC_CERT_P12_BASE64"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
          } >> "$GITHUB_ENV"
          if [ -n "$MAC_INSTALLER_CERT_P12_BASE64" ]; then
            {
              echo "CSC_INSTALLER_LINK=$MAC_INSTALLER_CERT_P12_BASE64"
              echo "CSC_INSTALLER_KEY_PASSWORD=$MAC_INSTALLER_CERT_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            {
              echo "APPLE_API_KEY=$key_path"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_API_KEY_P8 isn't set; the macOS app will be signed but not notarized"
          fi

      - run: npm run build:electron
        if: steps.check_tag.outputs.should_build == 'true' && matrix.edition == 'consumer'

      - run: npm run build:electron:enterprise
        if: steps.check_tag.outputs.should_build == 'true' && matrix.edition == 'enterprise'

      - run: npx electron-builder --publish always ${{ matrix.args }}
        if: steps.check_tag.outputs.should_build == 'true' && matrix.edition == 'consumer'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The enterprise build never publishes through electron-builder: that would also upload
      # latest*.yml update manifests and overwrite the consumer ones. Package locally, then
      # attach just the installers to the release.
      - run: npx electron-builder --config electron-builder.enterprise.cjs --publish never ${{ matrix.args }}
        if: steps.check_tag.outputs.should_build == 'true' && matrix.edition == 'enterprise'

      - name: Upload enterprise installers
        if: steps.check_tag.outputs.should_build == 'true' && matrix.edition == 'enterprise'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/enterprise/*-enterprise-*.{pkg,dmg,msi})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No enterprise installers were built" >&2
            exit 1
          fi
          gh release upload "${{ steps.check_tag.outputs.tag }}" "${files[@]}" --clobber
